<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" fill="none">
<defs>
<clipPath id="c"><rect width="1000" height="380" rx="20"/></clipPath>
<radialGradient id="g1"><stop offset="0" stop-color="#2f6bff" stop-opacity=".9"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".75"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="g3"><stop offset="0" stop-color="#00c2ff" stop-opacity=".6"/><stop offset="1" stop-color="#00c2ff" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".11"/></pattern>
<radialGradient id="fade" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="mk"><rect width="1000" height="380" fill="url(#fade)"/></mask>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#eef7ff"/><stop offset=".36" stop-color="#eef7ff"/>
  <stop offset=".47" stop-color="#00c2ff"/><stop offset=".55" stop-color="#b6a1ff"/>
  <stop offset=".66" stop-color="#eef7ff"/><stop offset="1" stop-color="#eef7ff"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="-1000 0" to="1000 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c2ff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".55"/></linearGradient>
</defs>
<style>
.s{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif} .m{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace}

.b1{animation:d1 16s ease-in-out infinite alternate}
.b2{animation:d2 19s ease-in-out infinite alternate}
.b3{animation:d3 13s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(240px,50px)}}
@keyframes d2{to{transform:translate(-230px,-40px)}}
@keyframes d3{to{transform:translate(-120px,60px)}}
.sw{animation:sw 8s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sw{0%{transform:translateX(-300px) skewX(-20deg)}55%,100%{transform:translateX(1200px) skewX(-20deg)}}
.in{animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
.i1{animation-delay:.1s}.i2{animation-delay:.3s}.i3{animation-delay:.5s}.i4{animation-delay:.7s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

</style>

<g clip-path="url(#c)">
  <rect width="1000" height="380" fill="#05080e"/>
  <g filter="url(#blur)">
    <circle class="b1" cx="230" cy="110" r="210" fill="url(#g1)"/>
    <circle class="b2" cx="790" cy="270" r="230" fill="url(#g2)"/>
    <circle class="b3" cx="600" cy="40" r="160" fill="url(#g3)"/>
  </g>
  <rect width="1000" height="380" fill="url(#dots)" mask="url(#mk)"/>
  <rect class="sw" x="0" y="-60" width="180" height="500" fill="url(#sweep)"/>
  <path d="M22 36V22H36" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.5"/><path d="M978 36V22H964" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.5"/><path d="M22 344V358H36" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.5"/><path d="M978 344V358H964" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.5"/>
  <g class="in i1">
    <circle cx="50" cy="52" r="3.5" fill="#2ee59d" opacity=".45"><animate attributeName="r" values="3.5;10.5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2s" repeatCount="indefinite"/></circle><circle cx="50" cy="52" r="3.5" fill="#2ee59d"/>
    <text x="64" y="56.5" class="m" font-size="12" letter-spacing="3" fill="#9fb0c7">ONLINE</text>
    <text x="950" y="56.5" class="m" font-size="12" letter-spacing="3" fill="#9fb0c7" text-anchor="end">~/REALBOMBI</text>
  </g>
  <g class="in i1">
    <rect x="285.0" y="96" width="430" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="500.0" y="118" class="m" font-size="12.5" letter-spacing="3.2" fill="#b9c6d8" text-anchor="middle">IT OPERATIONS  /  AI BUILDER  /  HOMELAB</text>
  </g>
  <g class="in i2">
    <text x="500.0" y="222" class="s" font-size="96" font-weight="800" letter-spacing="-3" fill="#00c2ff" opacity=".45" text-anchor="middle" filter="url(#glow)">Mads Ihle</text>
    <text x="500.0" y="222" class="s" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#shine)" text-anchor="middle">Mads Ihle</text>
  </g>
  <text x="500.0" y="270" class="s in i3" font-size="19" fill="#9fb0c7" text-anchor="middle">Building, breaking, hosting, fixing, and occasionally over-engineering things.</text>
  <g class="in i4">
    <text x="50" y="334" class="m" font-size="12" letter-spacing="3" fill="#6f8098">NORWAY  ·  CET</text>
    <text x="950" y="334" class="m" font-size="12" letter-spacing="3" fill="#6f8098" text-anchor="end">CLAUDE  ·  CODEX  ·  PROXMOX</text>
  </g>
</g>
<rect x=".75" y=".75" width="998.5" height="378.5" rx="19.5" stroke="url(#edge)" stroke-width="1.5"/>

</svg>
