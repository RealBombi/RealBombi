name: Generate contribution snake

on:
  schedule:
    - cron: "17 4 * * *" # Daily at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8b5cf6&color_dots=#161b22,#0b3d91,#1f5fbf,#2f8fff,#00c2ff
            dist/snake-light.svg?color_snake=#8b5cf6&color_dots=#ebedf0,#b6e3ff,#54aeff,#0969da,#0a3069

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in update-age.yml update-repos.yml snake.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
